name: Scraping offline checks
on:
  push:
    paths: ['medium/**', 'substack/**', 'scripts/**', 'tests/**', 'data/seeds/**', '.github/workflows/scraping-tests.yml']
  pull_request:
    paths: ['medium/**', 'substack/**', 'scripts/**', 'tests/**', 'data/seeds/**', '.github/workflows/scraping-tests.yml']
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r medium/requirements.txt
      - run: python -m unittest discover -s medium/tests -p 'test_*.py'
      - run: python -m unittest discover -s substack/tests -p 'test_*.py'
      - run: bash -n medium/scripts/run_dcc.sh
